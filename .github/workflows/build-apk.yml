name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          S=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          yes | "$S" --licenses >/dev/null 2>&1 || true
          "$S" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
      - name: Keystore
        run: keytool -genkeypair -keystore apno-release.jks -alias apno -keyalg RSA -keysize 2048 -validity 10000 -storepass "ApnoStore@2026" -keypass "ApnoStore@2026" -dname "CN=Apno Store, O=Apno Store, C=IN"
      - name: Gradle file
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins { alias(libs.plugins.android.application); alias(libs.plugins.kotlin.android) }
          android {
              namespace = "com.store.apno"
              compileSdk = 36
              defaultConfig { applicationId = "in.apnostore.app"; minSdk = 24; targetSdk = 36; versionCode = 1; versionName = "1.0" }
              signingConfigs { create("release") { storeFile = rootProject.file("../../apno-release.jks"); storePassword = "ApnoStore@2026"; keyAlias = "apno"; keyPassword = "ApnoStore@2026" } }
              buildTypes { release { signingConfig = signingConfigs.getByName("release"); isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_11; targetCompatibility = JavaVersion.VERSION_11 }
              kotlinOptions { jvmTarget = "11" }
              buildFeatures { viewBinding = true }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity)
              implementation(libs.androidx.constraintlayout)
              implementation(libs.androidbrowserhelper)
              implementation(libs.androidx.core.splashscreen)
              implementation(libs.app.update.ktx)
          }
          EOF
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/release/*.apk
            apno-release.jks
