name: Build APK

on:
  workflow_dispatch:
    inputs:
      pass:
        description: 'Keystore password (yaad rakhna)'
        required: true
        default: 'ApnoStore@2026'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Keystore
        run: |
          P="${{ github.event.inputs.pass }}"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apno-release.jks
          else
            keytool -genkeypair -keystore apno-release.jks -alias apno -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=Apno Store, O=Apno Store, C=IN"
          fi
          printf "storeFile=apno-release.jks\nstorePassword=%s\nkeyAlias=apno\nkeyPassword=%s\n" "$P" "$P" > keystore.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apno-store-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            apno-release.jks
