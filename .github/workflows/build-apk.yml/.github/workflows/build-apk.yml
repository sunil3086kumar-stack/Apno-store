name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ApnoStore@2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Android SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
      - name: Keystore banao
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > apno-release.jks
          else
            keytool -genkeypair -keystore apno-release.jks -alias apno \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Apno Store, O=Apno Store, C=IN"
          fi
      - name: Gradle file likho
        run: |
          cat > app/build.gradle.kts <<EOF
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
          }
          android {
              namespace = "com.store.apno"
              compileSdk = 36
              defaultConfig {
                  applicationId = "in.apnostore.app"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("../../apno-release.jks")
                      storePassword = "$KS_PASS"
                      keyAlias = "apno"
                      keyPassword = "$KS_PASS"
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_11
                  targetCompatibility = JavaVersion.VERSION_11
              }
              kotlinOptions { jvmTarget = "11" }
              buildFeatures { viewBinding = true }
          }
          dependencies {
              implementation(libs.androidx.core.ktx)
              implementation(libs.androidx.appcompat)
              implementation(libs.material)
              implementation(libs.androidx.activity)
              implementation(libs.androidx.constraintlayout)
              implementation(libs.androidbrowserhelper)
              implementation(libs.androidx.core.splashscreen)
              implementation(libs.app.update.ktx)
          }
          EOF
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apno-store-build
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            apno-release.jks
